packages:
  - "."

allowBuilds:
  node-pty: true
  esbuild: true
  better-sqlite3: true
  tesseract.js: false

overrides:
  nf3: "0.3.17"
  "@assistant-ui/tap": "^0.5.14"
  "@assistant-ui/store": ">=0.2.9 <0.2.14"

minimumReleaseAgeExclude:
  - typescript-7
  - typescript
  - fast-xml-parser
  - "@sentry/*"
  - "@typescript/*"
  - '@agent-native/core@0.109.4'
  - '@agent-native/toolkit@0.5.0'
