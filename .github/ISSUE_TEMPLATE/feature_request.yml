name: Feature request
description: Propose a change to what Shipwright does
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you unable to do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like instead
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: Effect on the trust boundary
      description: >
        Shipwright keeps GitHub credentials on the host and publishes only after
        an independent verification pass and an explicit human confirmation.
        Does this proposal change any of that? Say so plainly.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
